<!doctype html>
<html lang="en">

<head>
	<!-- Required meta tags -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Custom CSS -->
	<!-- Custom CSS -->
	<link href="index.css" rel="stylesheet">

	<title>Movies Review Web App</title>
</head>

<body>

	<div class="container mt-4">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h1 id="mainTitle">Movie reviews</h1>
			<div class="d-flex align-items-center">
				<label for="sortSelect" class="me-2 text-nowrap">Sort by:</label>
				<select class="form-select" id="sortSelect">
					<option value="movie_name">Movie Name</option>
					<option value="movie_rating">Rating</option>
					<option value="director_name">Director</option>
					<option value="release_date">Release Date</option>
				</select>
			</div>
		</div>

		<div class="mb-5 mt-5">
			<h5 class="mb-4" id="formTitle">add new review</h5>
			<div class="row g-2 mb-3">
				<div class="col-md-3">
					<input type="text" class="form-control" id="movieName" placeholder="Movie name">
				</div>
				<div class="col-md-3">
					<input type="text" class="form-control" id="directorName" placeholder="Director's name">
				</div>
				<div class="col-md-3">
					<input type="date" class="form-control" id="releaseDate" placeholder="Release date">
				</div>
				<div class="col-md-3">
					<select class="form-select" id="movieRating">
						<option value="0">0/5</option>
						<option value="1" selected>1/5</option>
						<option value="2">2/5</option>
						<option value="3">3/5</option>
						<option value="4">4/5</option>
						<option value="5">5/5</option>
					</select>
				</div>
			</div>
			<div class="d-flex">
				<button type="button" class="btn btn-primary" id="addButton">Add</button>
				<button type="button" class="btn btn-secondary ms-2 d-none" id="cancelButton">Cancel</button>
			</div>
		</div>

		<table class="table">
			<thead>
				<tr>
					<th>Movie Name</th>
					<th>Director</th>
					<th>Release Date</th>
					<th>Rating</th>
					<th>Actions</th>
				</tr>
			</thead>
			<tbody id="reviewList">
			</tbody>
		</table>
	</div>


	<!-- jQuery -->
	<script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

	<!-- Our Firebase code -->
	<script type="module" src="myscript.js"></script>



</body>

</html>
